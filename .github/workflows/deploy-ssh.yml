name: deploy-ssh

# Deploys the Go SSH TUI (cmd/fetzer) to the single EC2 instance running it.
#
# This workflow can only ever run as a push to `main`: the deploy role's
# OIDC trust policy is scoped with StringEquals to
# repo:phetzy/fetzycloudonline:ref:refs/heads/main, so any other sub claim
# (a pull_request build, a different branch, a fork) is refused at
# sts:AssumeRoleWithWebIdentity. workflow_dispatch on the main branch emits
# that same sub claim, so it is accepted; a pull_request trigger would not
# be, and must not be added here.
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'content.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-ssh.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for OIDC; nothing else needs elevating

# Two overlapping pushes to main must not race each other's deploy onto the
# same instance. Do not cancel-in-progress: a run that's already inside
# update-fetzer.sh's swap-and-restart must be allowed to finish (and roll
# back on failure) rather than being killed mid-deploy.
concurrency:
  group: deploy-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required configuration
        run: |
          missing=()
          [ -z "${{ vars.DEPLOY_ROLE_ARN }}" ] && missing+=(DEPLOY_ROLE_ARN)
          [ -z "${{ vars.ARTIFACT_BUCKET }}" ] && missing+=(ARTIFACT_BUCKET)
          [ -z "${{ vars.INSTANCE_ID }}" ] && missing+=(INSTANCE_ID)
          [ -z "${{ vars.AWS_REGION }}" ] && missing+=(AWS_REGION)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variable(s): ${missing[*]}. See terraform/README.md." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build (linux/arm64, matches the Graviton instance)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o fetzer ./cmd/fetzer

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload binary
        # update-fetzer.sh (terraform/files/update-fetzer.sh) only ever reads
        # the "current" key — that is the one the instance pulls on deploy.
        # "builds/<sha>" is kept alongside it, indefinitely, purely so a
        # human (or a future rollback command) can point "current" back at
        # an older build. Both keys must stay in sync: change one side of
        # this step without the other and the instance keeps pulling
        # whatever "current" last pointed at while "builds/" silently drifts
        # out of sync with it.
        #
        # Two separate `aws s3 cp` calls from the runner's local file, not a
        # server-side `aws s3 cp` from builds/<sha> to current: an S3-to-S3
        # copy needs s3:GetObject on the deploy role, and that role
        # deliberately holds only s3:PutObject (terraform/iam.tf). Do not
        # "optimize" this into a copy — it will fail with AccessDenied.
        #
        # Both must succeed before the SSM step runs. If the "current" put
        # fails after "builds/<sha>" succeeded, the workflow must not
        # proceed to deploy: the instance would pull a stale "current" while
        # the job reports on a build that isn't actually live.
        run: |
          aws s3 cp fetzer "s3://${{ vars.ARTIFACT_BUCKET }}/builds/${{ github.sha }}"
          aws s3 cp fetzer "s3://${{ vars.ARTIFACT_BUCKET }}/current"

      - name: Deploy via SSM
        id: deploy
        # ssm:SendCommand only grants this role AWS-RunShellScript on the one
        # instance ARN baked into the deploy role's policy (terraform/iam.tf);
        # the role has no ec2:DescribeInstances or
        # ssm:DescribeInstanceInformation, so the instance ID cannot be
        # looked up here and must come from the INSTANCE_ID repository
        # variable instead.
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/usr/local/bin/update-fetzer.sh"]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $command_id"

      - name: Wait for deploy to finish
        id: wait
        # send-command returns as soon as the command is accepted by the SSM
        # service, not when it finishes running on the instance.
        # update-fetzer.sh sleeps 3s before its health check and then
        # restarts a systemd unit, so the real result is only known well
        # after send-command has already returned. Poll
        # get-command-invocation until it reaches a terminal status.
        run: |
          set -uo pipefail

          command_id="${{ steps.deploy.outputs.command_id }}"
          instance_id="${{ vars.INSTANCE_ID }}"
          terminal_statuses="Success Failed Cancelled TimedOut Cancelling"
          status="Pending"
          invocation=""

          for _ in $(seq 1 60); do
            attempt=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --output json 2>/dev/null)

            if [ -n "$attempt" ]; then
              invocation="$attempt"
              status=$(echo "$invocation" | jq -r '.Status')
              case " $terminal_statuses " in
                *" $status "*) break ;;
              esac
            fi

            sleep 5
          done

          echo "Final status: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ -n "$invocation" ]; then
            echo "--- stdout ---"
            echo "$invocation" | jq -r '.StandardOutputContent'
            echo "--- stderr ---"
            echo "$invocation" | jq -r '.StandardErrorContent'
          else
            echo "::warning::Never received a command invocation result from SSM before timing out."
          fi

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy command finished with status $status" >&2
            exit 1
          fi
